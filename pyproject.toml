[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "la-caja-mcp"
version = "0.1.0"
description = "Sistema MCP de acceso y debate sobre La Caja (memoria contextual). Repo B."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastmcp>=3"]

[project.optional-dependencies]
dev = ["pytest>=7"]
host = ["uvicorn"]

[project.scripts]
la-caja-mcp = "la_caja_mcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
