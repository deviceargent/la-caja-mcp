[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "la-caja-mcp"
version = "0.1.0"
description = "Minimal MCP workspace for adversarial collaborative research"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28,<2",
]

[project.scripts]
lacaja-mcp = "lacaja_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
